AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: td Puzzles API
Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
  GoogleOAuthClientId:
    Type: String
    Default: ''
  AllowDevLogin:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
  ResendApiKey:
    Type: String
    NoEcho: true
    Default: ''
  ResendSenderEmail:
    Type: String
    Default: ''
Globals:
  Function:
    Runtime: python3.12
    Architectures:
    - x86_64
    Timeout: 10
    MemorySize: 512
Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowHeaders:
        - Authorization
        - Content-Type
        AllowMethods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
    Metadata:
      SamResourceId: HttpApi
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-oguucbjeft6o/6ee22f5429eeb2717c4de8acdade89be
      Handler: app.main.handler
      Environment:
        Variables:
          USERS_TABLE:
            Ref: UsersTable
          IDENTITIES_TABLE:
            Ref: IdentitiesTable
          PUZZLES_TABLE:
            Ref: PuzzlesTable
          SCORES_TABLE:
            Ref: ScoresTable
          FRIENDSHIPS_TABLE:
            Ref: FriendshipsTable
          FRIEND_REQUESTS_TABLE:
            Ref: FriendRequestsTable
          VERIFICATION_CODES_TABLE:
            Ref: VerificationCodesTable
          PASSWORD_RESET_CODES_TABLE:
            Ref: PasswordResetCodesTable
          ACHIEVEMENTS_TABLE:
            Ref: AchievementsTable
          CHALLENGES_TABLE:
            Ref: ChallengesTable
          JWT_SECRET:
            Ref: JwtSecret
          GOOGLE_OAUTH_CLIENT_ID:
            Ref: GoogleOAuthClientId
          ALLOW_DEV_LOGIN:
            Ref: AllowDevLogin
          RESEND_API_KEY:
            Ref: ResendApiKey
          RESEND_SENDER_EMAIL:
            Ref: ResendSenderEmail
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UsersTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: IdentitiesTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: PuzzlesTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ScoresTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FriendshipsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: VerificationCodesTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: PasswordResetCodesTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FriendRequestsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AchievementsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ChallengesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      SamResourceId: ApiFunction
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: user_id
        AttributeType: S
      - AttributeName: display_name_lower
        AttributeType: S
      - AttributeName: email_lower
        AttributeType: S
      KeySchema:
      - AttributeName: user_id
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: byDisplayNameLower
        KeySchema:
        - AttributeName: display_name_lower
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      - IndexName: byEmailLower
        KeySchema:
        - AttributeName: email_lower
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: guest_expires_at_epoch
        Enabled: true
    Metadata:
      SamResourceId: UsersTable
  IdentitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: provider
        AttributeType: S
      - AttributeName: provider_subject
        AttributeType: S
      - AttributeName: user_id
        AttributeType: S
      KeySchema:
      - AttributeName: provider
        KeyType: HASH
      - AttributeName: provider_subject
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: byUserId
        KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        Projection:
          ProjectionType: ALL
    Metadata:
      SamResourceId: IdentitiesTable
  PuzzlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: puzzle_id
        AttributeType: S
      KeySchema:
      - AttributeName: puzzle_id
        KeyType: HASH
    Metadata:
      SamResourceId: PuzzlesTable
  ScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: puzzle_id
        AttributeType: S
      - AttributeName: user_id
        AttributeType: S
      KeySchema:
      - AttributeName: puzzle_id
        KeyType: HASH
      - AttributeName: user_id
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: byUserId
        KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: puzzle_id
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: guest_expires_at_epoch
        Enabled: true
    Metadata:
      SamResourceId: ScoresTable
  FriendshipsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: user_id
        AttributeType: S
      - AttributeName: friend_id
        AttributeType: S
      KeySchema:
      - AttributeName: user_id
        KeyType: HASH
      - AttributeName: friend_id
        KeyType: RANGE
    Metadata:
      SamResourceId: FriendshipsTable
  FriendRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: to_user_id
        AttributeType: S
      - AttributeName: from_user_id
        AttributeType: S
      KeySchema:
      - AttributeName: to_user_id
        KeyType: HASH
      - AttributeName: from_user_id
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: byFromUserId
        KeySchema:
        - AttributeName: from_user_id
          KeyType: HASH
        Projection:
          ProjectionType: ALL
    Metadata:
      SamResourceId: FriendRequestsTable
  VerificationCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: user_id
        AttributeType: S
      KeySchema:
      - AttributeName: user_id
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true
    Metadata:
      SamResourceId: VerificationCodesTable
  PasswordResetCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: user_id
        AttributeType: S
      KeySchema:
      - AttributeName: user_id
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true
    Metadata:
      SamResourceId: PasswordResetCodesTable
  AchievementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: user_id
        AttributeType: S
      KeySchema:
      - AttributeName: user_id
        KeyType: HASH
    Metadata:
      SamResourceId: AchievementsTable
  ChallengesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: challenge_id
        AttributeType: S
      - AttributeName: pair_key
        AttributeType: S
      - AttributeName: challenger_id
        AttributeType: S
      - AttributeName: challengee_id
        AttributeType: S
      - AttributeName: created_at
        AttributeType: S
      KeySchema:
      - AttributeName: challenge_id
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: byPair
        KeySchema:
        - AttributeName: pair_key
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: byChallenger
        KeySchema:
        - AttributeName: challenger_id
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: byChallengee
        KeySchema:
        - AttributeName: challengee_id
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true
    Metadata:
      SamResourceId: ChallengesTable
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: td-puzzles-web-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
    Metadata:
      SamResourceId: WebBucket
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: arn:aws:s3:::${WebBucket}/*
    Metadata:
      SamResourceId: WebBucketPolicy
  UsersRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      Name:
        Fn::Sub: ${AWS::StackName}-users-rewrite
      FunctionConfig:
        Comment: Rewrite /users/{name} to /users/index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: "function handler(event) {\n    var uri = event.request.uri;\n\
        \    if (/^\\/users\\/[^\\/]+\\/?$/.test(uri)) {\n        event.request.uri\
        \ = '/users/index.html';\n    }\n    return event.request;\n}\n"
    Metadata:
      SamResourceId: UsersRewriteFunction
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: td Puzzles web app
        Enabled: true
        HttpVersion: http2
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
        - Id: S3WebOrigin
          DomainName:
            Fn::Select:
            - 1
            - Fn::Split:
              - //
              - Fn::GetAtt:
                - WebBucket
                - WebsiteURL
          CustomOriginConfig:
            HTTPPort: 80
            OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3WebOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
          - EventType: viewer-request
            FunctionARN:
              Fn::GetAtt:
              - UsersRewriteFunction
              - FunctionARN
    Metadata:
      SamResourceId: WebDistribution
Outputs:
  ApiUrl:
    Description: Base URL of the deployed API
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  WebUrl:
    Description: CloudFront URL for the web app
    Value:
      Fn::Sub: https://${WebDistribution.DomainName}
  WebBucketName:
    Description: S3 bucket for web deployment
    Value:
      Ref: WebBucket
