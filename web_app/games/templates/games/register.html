{% extends "games/base.html" %}
{% block title %}Register — td Puzzles{% endblock %}
{% block extra_head %}
<script src="https://accounts.google.com/gsi/client" async defer></script>
{% endblock %}
{% block content %}
<div class="auth-page">
  <h1>Create Account</h1>

  <div id="form-error" class="alert alert-error" style="display:none"></div>

  <div class="form-group">
    <label class="form-label" for="display-name">Display Name</label>
    <input class="form-input" type="text" id="display-name" maxlength="50" placeholder="How you appear on leaderboards">
  </div>
  <div class="form-group">
    <label class="form-label" for="email">Email</label>
    <input class="form-input" type="email" id="email" autocomplete="email" placeholder="you@example.com">
  </div>
  <div class="form-group">
    <label class="form-label" for="password">Password</label>
    <input class="form-input" type="password" id="password" autocomplete="new-password" placeholder="8+ characters">
  </div>
  <button class="btn btn-primary btn-full" id="register-btn">Create Account</button>

  <div class="or-divider">or</div>

  <div id="g_id_onload"
       data-client_id="{{ google_client_id }}"
       data-callback="handleGoogleSignIn"
       data-auto_prompt="false">
  </div>
  <button class="google-btn" onclick="google.accounts.id.prompt()">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Continue with Google
  </button>
  <p id="google-error" class="form-error" style="text-align:center"></p>

  <div class="auth-links">
    Already have an account? <a href="/login/">Log In</a>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
  document.getElementById('register-btn').addEventListener('click', async () => {
    const btn = document.getElementById('register-btn');
    const errEl = document.getElementById('form-error');
    const name = document.getElementById('display-name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    errEl.style.display = 'none';
    if (!name || !email || !password) { errEl.textContent = 'Please fill in all fields.'; errEl.style.display = ''; return; }
    if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = ''; return; }
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      await Auth.register(name, email, password);
      window.location.href = '/verify-email/';
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = '';
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  });
</script>
{% endblock %}
