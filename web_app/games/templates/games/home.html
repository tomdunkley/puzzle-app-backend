{% extends "games/base.html" %}
{% load static %}
{% block title %}td Puzzles{% endblock %}
{% block content %}
<div class="game-cards">
  <a href="/words/" class="game-card game-card-words">
    <div class="game-card-icon">
      <span class="material-symbols-outlined">grid_on</span>
    </div>
    <div class="game-card-text">
      <h2>Words</h2>
      <p>Find as many words as you can before time runs out.</p>
    </div>
  </a>
  <a href="/numbers/" class="game-card game-card-numbers">
    <div class="game-card-icon">
      <span class="material-symbols-outlined">calculate</span>
    </div>
    <div class="game-card-text">
      <h2>Numbers</h2>
      <p>Combine six numbers to get as close to the target as you can.</p>
    </div>
  </a>
</div>
{% endblock %}
