{% extends "games/base.html" %}
{% load static %}
{% block title %}Words — td Puzzles{% endblock %}
{% block content %}
<div class="game-page">
  <div class="game-header">
    <h1 class="game-color-words">Words</h1>
    <div class="game-meta">
      <span id="word-count" class="word-count"></span>
      <span id="timer" class="timer" style="display:none">3:00</span>
    </div>
  </div>

  <div id="state-loading" class="state-panel">
    <p style="color:var(--ink-mid)">Loading today's puzzle…</p>
  </div>

  <div id="state-already-played" class="state-panel" style="display:none">
    <div class="results-header">
      <h2 id="already-score"></h2>
      <p id="already-words-label" style="color:var(--ink-mid); margin-top:4px; font-size:0.9rem"></p>
    </div>
    <div id="already-words" class="found-words-chips" style="margin-top:12px"></div>
    <div id="already-leaderboard" class="leaderboard-section"></div>
  </div>

  <div id="state-playing" style="display:none">
    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>
    <div class="current-word-wrap">
      <div id="current-word" class="current-word"></div>
    </div>
    <div class="found-words-wrap">
      <div id="found-words" class="found-words-chips"></div>
    </div>
    <button class="btn btn-ghost btn-sm" id="pause-btn" style="margin-top:8px">Pause</button>
  </div>

  <div id="state-paused" class="state-panel" style="display:none">
    <div class="pause-screen">
      <h2>Paused</h2>
      <p id="pause-score"></p>
      <button class="btn btn-primary" id="resume-btn">Resume</button>
      <br><button class="btn btn-ghost" id="finish-early-btn" style="margin-top:10px">Finish</button>
    </div>
  </div>

  <div id="state-results" class="state-panel" style="display:none">
    <div class="results-header">
      <h2 id="results-score"></h2>
      <p id="results-words-label" style="color:var(--ink-mid); margin-top:4px; font-size:0.9rem"></p>
    </div>
    <div id="results-words" class="found-words-chips" style="margin-top:12px"></div>
    <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-secondary btn-sm" id="share-btn">Share result</button>
    </div>
    <p id="share-msg" class="share-msg">Copied to clipboard!</p>
    <div id="results-leaderboard" class="leaderboard-section"></div>
  </div>

  <div id="state-error" class="state-panel" style="display:none">
    <p class="alert alert-error" id="error-msg"></p>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>window.TD_DICT_URL = "{% static 'games/data/dictionary.txt' %}";</script>
<script src="{% static 'games/js/leaderboard.js' %}"></script>
<script src="{% static 'games/js/boggle.js' %}"></script>
{% endblock %}
