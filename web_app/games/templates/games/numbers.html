{% extends "games/base.html" %}
{% load static %}
{% block title %}Numbers — td Puzzles{% endblock %}
{% block content %}
<div class="game-page">
  <div class="game-header">
    <h1 class="game-color-numbers">Numbers</h1>
    <div class="game-meta">
      <span id="timer" class="timer" style="display:none">3:00</span>
    </div>
  </div>

  <div id="state-loading" class="state-panel">
    <p style="color:var(--ink-mid)">Loading today's puzzle…</p>
  </div>

  <div id="state-already-played" class="state-panel" style="display:none">
    <div class="results-header">
      <h2 id="already-headline"></h2>
      <p id="already-result" style="color:var(--ink-mid); margin-top:4px; font-size:0.9rem"></p>
    </div>
    <div id="already-steps" class="numbers-solution" style="margin-top:12px"></div>
    <div id="already-leaderboard" class="leaderboard-section"></div>
  </div>

  <div id="state-playing" style="display:none">
    <div class="numbers-target-wrap">
      <span class="numbers-target-label">Target</span>
      <span id="target" class="numbers-target"></span>
      <div id="closest-display" class="closest-display"></div>
    </div>

    <div id="tiles" class="numbers-tiles"></div>

    <div id="calc-display" class="calc-display"></div>

    <div class="numbers-operators">
      <button class="op-btn" data-op="+">+</button>
      <button class="op-btn" data-op="−">−</button>
      <button class="op-btn" data-op="×">×</button>
      <button class="op-btn" data-op="÷">÷</button>
    </div>

    <div class="numbers-actions">
      <button class="btn btn-ghost btn-sm" id="reset-btn">Reset</button>
      <button class="btn btn-primary btn-sm" id="submit-btn" disabled>Submit</button>
    </div>
    <button class="btn btn-ghost btn-sm" id="pause-btn" style="margin-top:10px">Pause</button>
  </div>

  <div id="state-paused" class="state-panel" style="display:none">
    <div class="pause-screen">
      <h2>Paused</h2>
      <p id="pause-closest"></p>
      <button class="btn btn-primary" id="resume-btn">Resume</button>
      <br><button class="btn btn-ghost" id="finish-early-btn" style="margin-top:10px">Finish</button>
    </div>
  </div>

  <div id="state-results" class="state-panel" style="display:none">
    <div class="results-header">
      <h2 id="results-headline"></h2>
      <p id="results-sub" style="color:var(--ink-mid); margin-top:4px; font-size:0.9rem"></p>
    </div>
    <div id="results-steps" class="numbers-solution" style="margin-top:12px"></div>
    <div id="solution-wrap" style="display:none; margin-top:16px">
      <p style="font-size:0.76rem; color:var(--ink-mid); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em">Suggested solution</p>
      <div id="solution-steps" class="numbers-solution numbers-solution--muted"></div>
    </div>
    <div id="results-leaderboard" class="leaderboard-section"></div>
  </div>

  <div id="state-error" class="state-panel" style="display:none">
    <p class="alert alert-error" id="error-msg"></p>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{% static 'games/js/leaderboard.js' %}"></script>
<script src="{% static 'games/js/numbers.js' %}"></script>
{% endblock %}
